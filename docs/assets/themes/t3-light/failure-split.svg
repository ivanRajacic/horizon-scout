<text x="485.6" y="142.0" font-family='Consolas, "SF Mono", ui-monospace, "Liberation Mono", monospace' font-size="13" font-weight="400" fill="#121114" text-anchor="start" letter-spacing="0.2" font-variant-numeric="tabular-nums">10</text>
