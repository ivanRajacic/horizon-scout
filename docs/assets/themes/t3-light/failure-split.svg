<text x="28.0" y="200.0" font-family='Consolas, "SF Mono", ui-monospace, "Liberation Mono", monospace' font-size="9.1" font-weight="400" fill="#6f6a72" text-anchor="start" letter-spacing="0.2">retrieval found part of the gold set</text>
<rect x="260.00" y="172.00" width="192.27" height="22.00" rx="0.0" fill="#a49d92"/>
