<text x="28.0" y="52.0" font-family='Consolas, "SF Mono", ui-monospace, "Liberation Mono", monospace' font-size="22" font-weight="700" fill="#121114" text-anchor="start" letter-spacing="1.4">Most failures happen after retrieval</text>
<text x="28.0" y="78.0" font-family='Consolas, "SF Mono", ui-monospace, "Liberation Mono", monospace' font-size="11.2" font-weight="400" fill="#3b3840" text-anchor="start" letter-spacing="0.2">22 of 33 judged questions scored under 0.50. Bar length is how many of the 22 fell in each group.</text>
<text x="28.0" y="94.0" font-family='Consolas, "SF Mono", ui-monospace, "Liberation Mono", monospace' font-size="11.2" font-weight="400" fill="#3b3840" text-anchor="start" letter-spacing="0.2">The largest group had every gold project in front of it and still answered wrongly.</text>
<text x="28.0" y="139.0" font-family='Consolas, "SF Mono", ui-monospace, "Liberation Mono", monospace' font-size="11.5" font-weight="700" fill="#121114" text-anchor="start" letter-spacing="0.8">answer failed anyway</text>
<text x="28.0" y="154.0" font-family='Consolas, "SF Mono", ui-monospace, "Liberation Mono", monospace' font-size="9.1" font-weight="400" fill="#6f6a72" text-anchor="start" letter-spacing="0.2">all the gold projects were in the context</text>
