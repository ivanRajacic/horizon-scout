<text x="28.0" y="306.0" font-family='Consolas, "SF Mono", ui-monospace, "Liberation Mono", monospace' font-size="10.4" font-weight="400" fill="#3b3840" text-anchor="start" letter-spacing="0.2">Mean score with the full gold set in context 0.45; with it missing or partial 0.28.</text>
<text x="28.0" y="323.0" font-family='Consolas, "SF Mono", ui-monospace, "Liberation Mono", monospace' font-size="9.8" font-weight="400" fill="#6f6a72" text-anchor="start" letter-spacing="0.2">Better retrieval could move the 12 with gold missing - not the 10 that failed with it in hand.</text>
